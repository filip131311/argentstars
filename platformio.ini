[env:m5paper]
platform = espressif32
board = m5stack-fire
framework = arduino
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
lib_deps =
    m5stack/M5Unified@^0.2.5
    bblanchon/ArduinoJson@^7.2.0
monitor_speed = 115200
upload_speed = 460800
